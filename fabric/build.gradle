plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
    id 'com.gradleup.shadow' version "9.6.1"
}

configurations {
    shadowImplementation
    implementation.extendsFrom(shadowImplementation)
}

def env = [:]
def envFile = layout.projectDirectory.file('.env')
if (envFile.asFile.exists()) {
    providers.fileContents(envFile).asText.get().eachLine { line ->
        if (line.trim() && !line.startsWith('#')) {
            def parts = line.split('=', 2)
            if (parts.length == 2) env[parts[0].trim()] = parts[1].trim()
        }
    }
}


dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
    shadowImplementation("javazoom:jlayer:1.0.1")
    shadowImplementation("org.overviewproject:mime-types:2.0.0")
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            if (env['MC_TOKEN']) {
                println env
                programArgs '--username=' + env['MC_USERNAME'], '--uuid=' + env['MC_UUID'], '--accessToken ' + env['MC_TOKEN']
            }

            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }

}

shadowJar {
    configurations = [project.configurations.shadowImplementation]
    archiveClassifier = ''

    mergeServiceFiles();

    relocate 'org.overviewproject', '%s.shadow.org.overviewproject'.formatted(project.group)
    relocate 'org.mozilla', '%s.shadow.org.mozilla'.formatted(project.group)
    relocate 'javazoom.jl', '%s.shadow.javazoom.jl'.formatted(project.group)

    exclude 'META-INF/maven/**'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
}

jar {
    enabled = false
    dependsOn shadowJar
}

assemble.dependsOn(shadowJar)


// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
